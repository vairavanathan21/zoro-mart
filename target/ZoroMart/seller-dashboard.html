<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZoroMart | Seller Studio</title><link rel="stylesheet" href="style.css"><style>.dash{padding:120px 7% 70px}.eyebrow{color:#d4af37;letter-spacing:3px;font-size:11px;font-weight:800}.dash h1{font:700 38px Cinzel,serif;margin:8px 0}.layout{display:grid;grid-template-columns:340px 1fr;gap:22px;margin-top:28px}.panel{background:#141416;border:1px solid #2b2b30;border-radius:16px;padding:22px}.panel h2{font-size:18px;margin-bottom:18px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:#bbb;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;background:#0b0b0d;border:1px solid #343438;color:#fff;border-radius:8px}.btn{padding:12px 16px;border:0;border-radius:8px;background:#d4af37;color:#080808;font-weight:800;cursor:pointer}.listing{padding:14px 0;border-bottom:1px solid #303035;display:flex;justify-content:space-between;gap:12px}.listing small{display:block;color:#999;margin-top:5px}.del{background:transparent;border:1px solid #7f3434;color:#ff8c8c;border-radius:7px;padding:7px 10px;cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><header class="header"><a class="logo" href="index.html"><span>⚡</span>ZoroMart</a><nav class="nav"><a href="products.html">Marketplace</a><a href="orders.html">Incoming Orders</a><a href="admin-dashboard.html">Admin</a><a href="login.html">Logout</a></nav></header><main class="dash"><p class="eyebrow">SELLER WORKSPACE</p><h1>Seller Studio</h1><p style="color:#999">Create and manage product listings. In the Java build, save these through ProductServlet + JDBC.</p><section class="panel" style="margin:24px 0"><h2>Incoming orders for your products</h2><div id="sellerOrders">Loading orders…</div></section><div class="layout"><form class="panel" id="productForm"><h2 id="formTitle">Add a product</h2><div class="field"><label>Product name</label><input id="pname" required maxlength="100" placeholder="e.g. Wireless Speaker"></div><div class="field"><label>Description</label><textarea id="pdesc" rows="3" placeholder="Product details"></textarea></div><div class="field"><label>Price (₹)</label><input id="pprice" type="number" min="1" step="0.01" required></div><div class="field"><label>Stock quantity</label><input id="pstock" type="number" min="0" required value="1"></div><div class="field"><label>Image URL (optional)</label><input id="pimage" type="url" placeholder="https://example.com/product.jpg"></div><div class="field"><label>Category</label><select id="pcat"><option>Electronics</option><option>Fashion</option><option>Computers</option><option>Home</option><option>Gaming</option><option>Accessories</option></select></div><button class="btn" type="submit">Save listing</button> <button class="btn" type="button" style="background:#29292d;color:#eee" onclick="resetForm()">Clear</button></form><section class="panel"><h2>Your listings</h2><div id="listings"></div></section></div></main><script>let editing=null;function get(){return JSON.parse(localStorage.getItem('zoroListings')||'[]')}function save(a){localStorage.setItem('zoroListings',JSON.stringify(a))}function render(){let a=get();document.getElementById('listings').innerHTML=a.length?a.map(p=>`<div class="listing"><div><b>${p.name}</b><small>${p.category} · ₹${Number(p.price).toLocaleString('en-IN')} · stock ${p.stock}</small></div><div><button class="btn" onclick="edit(${p.id})">Edit</button> <button class="del" onclick="removeItem(${p.id})">Delete</button></div></div>`).join(''):'<p style="color:#999">No custom listings yet. Add your first product.</p>'}function edit(id){let p=get().find(x=>x.id===id);if(!p)return;editing=id;['name','desc','price','stock','cat'].forEach((k,i)=>document.getElementById('p'+k).value=[p.name,p.desc||'',p.price,p.stock,p.category][i]);document.getElementById('formTitle').textContent='Edit listing'}function removeItem(id){save(get().filter(p=>p.id!==id));render()}function resetForm(){editing=null;document.getElementById('productForm').reset();document.getElementById('formTitle').textContent='Add a product'}document.getElementById('productForm').addEventListener('submit',e=>{e.preventDefault();let a=get(),p={id:editing||Date.now(),name:document.getElementById('pname').value.trim(),desc:document.getElementById('pdesc').value.trim(),price:Number(document.getElementById('pprice').value),stock:Number(document.getElementById('pstock').value),category:document.getElementById('pcat').value,seller:(JSON.parse(localStorage.getItem('zoroCurrentUser')||'{}').name||'Demo Seller'),art:'📦'};if(editing)a=a.map(x=>x.id===editing?p:x);else a.push(p);save(a);resetForm();render()});render();</script><script src="backend.js"></script></body></html>
