<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZoroMart | Products</title><link rel="stylesheet" href="style.css"><style>
.catalog{padding:125px 7% 70px;min-height:80vh}.catalog-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}.eyebrow{color:#d4af37;letter-spacing:3px;font-size:11px;font-weight:800}.catalog h1{font-family:Cinzel,serif;font-size:38px;margin:8px 0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.filters input,.filters select{background:#141416;color:#eee;border:1px solid #343438;border-radius:10px;padding:12px 14px}.filters input{min-width:240px}.catalog-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.item{background:linear-gradient(145deg,#18181b,#101012);border:1px solid #29292d;border-radius:16px;overflow:hidden;transition:.25s}.item:hover{transform:translateY(-4px);border-color:#8e7429}.item-art{height:170px;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle,#28251a,#121214 70%)}.item-body{padding:17px}.item small{color:#d4af37}.item h3{margin:7px 0;font-size:16px}.item p{font-size:12px;color:#999;line-height:1.5}.item-price{font-size:20px;font-weight:800;margin:12px 0}.gold-action{width:100%;padding:11px;border:0;border-radius:9px;background:#d4af37;color:#080808;font-weight:800;cursor:pointer}.gold-action:hover{background:#f0cf5c}.empty{padding:35px;text-align:center;color:#aaa;grid-column:1/-1}@media(max-width:1000px){.catalog-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.catalog-grid{grid-template-columns:1fr}.catalog{padding:110px 5% 40px}.catalog h1{font-size:29px}}
</style></head><body><header class="header"><a class="logo" href="index.html"><span>⚡</span>ZoroMart</a><div class="search-box"><input id="searchInput" placeholder="Search products..."><button id="searchBtn">⌕</button></div><nav class="nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="cart.html">🛒 Cart</a><a href="login.html">Login</a></nav></header><main class="catalog"><div class="catalog-head"><div><p class="eyebrow">THE MARKETPLACE</p><h1>Explore Products</h1><p style="color:#999">Discover listings from independent sellers.</p></div><a class="gold-btn" href="seller-dashboard.html">Sell on ZoroMart ↗</a></div><div class="filters"><input id="keyword" placeholder="Search by product or keyword"><select id="category"><option value="ALL">All categories</option><option>Electronics</option><option>Fashion</option><option>Computers</option><option>Home</option><option>Gaming</option><option>Accessories</option></select><select id="sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="catalog-grid" id="grid"></div></main><script>
const defaults=[{id:1,name:'Premium Smartphone',category:'Electronics',price:24999,stock:12,seller:'Nova Tech',art:'📱',desc:'Fast performance with a vivid display.'},{id:2,name:'Wireless Headphones',category:'Accessories',price:1999,stock:25,seller:'SoundHouse',art:'🎧',desc:'Immersive sound and all-day comfort.'},{id:3,name:'Ultra Laptop',category:'Computers',price:59999,stock:8,seller:'Nova Tech',art:'💻',desc:'Powerful everyday productivity.'},{id:4,name:'Smart Watch',category:'Accessories',price:2499,stock:16,seller:'TimeCraft',art:'⌚',desc:'Your daily activity on your wrist.'},{id:5,name:'Everyday Hoodie',category:'Fashion',price:1299,stock:30,seller:'Urban Loom',art:'👕',desc:'Comfortable premium cotton.'},{id:6,name:'Gaming Controller',category:'Gaming',price:3499,stock:10,seller:'PixelPlay',art:'🎮',desc:'Precision controls for game night.'},{id:7,name:'Desk Lamp',category:'Home',price:899,stock:18,seller:'Nest Living',art:'💡',desc:'Warm light for work and reading.'},{id:8,name:'Mechanical Keyboard',category:'Computers',price:4299,stock:9,seller:'Nova Tech',art:'⌨️',desc:'Tactile keys for work and play.'}];
function allProducts(){return [...defaults,...JSON.parse(localStorage.getItem('zoroListings')||'[]')]}function render(){let q=document.getElementById('keyword').value.toLowerCase(),c=document.getElementById('category').value,s=document.getElementById('sort').value;let a=allProducts().filter(p=>(p.name+' '+p.category+' '+(p.seller||'')).toLowerCase().includes(q)&&(c==='ALL'||p.category===c));if(s==='low')a.sort((x,y)=>x.price-y.price);if(s==='high')a.sort((x,y)=>y.price-x.price);document.getElementById('grid').innerHTML=a.length?a.map(p=>`<article class="item"><div class="item-art">${p.art||'📦'}</div><div class="item-body"><small>${p.category} · ${p.stock} in stock</small><h3>${p.name}</h3><p>${p.desc||'Seller listed product'}<br>Seller: ${p.seller||'ZoroMart Seller'}</p><div class="item-price">₹${Number(p.price).toLocaleString('en-IN')}</div><button class="gold-action" onclick="addCart(${p.id})">Add to Cart +</button></div></article>`).join(''):'<div class="empty">No products match your search.</div>'}function addCart(id){let p=allProducts().find(x=>x.id==id);let cart=JSON.parse(localStorage.getItem('zoroCart')||'[]');let found=cart.find(x=>x.name===p.name);if(found)found.quantity=(found.quantity||1)+1;else cart.push({name:p.name,price:p.price,quantity:1,category:p.category,art:p.art});localStorage.setItem('zoroCart',JSON.stringify(cart));alert(p.name+' added to cart');}['keyword','category','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('searchBtn').onclick=()=>{document.getElementById('keyword').value=document.getElementById('searchInput').value;render()};render();
</script><script src="backend.js"></script></body></html>
