<style>
:root {
  --gold: #d4af37;
  --bg: #09090b;
  --card: #151518;
  --muted: #999;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

.catalog {
  padding: 125px 7% 70px;
  min-height: 100vh;
}

.catalog-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.eyebrow {
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 11px;
  font-weight: 800;
}

.catalog h1 {
  font-size: 38px;
  margin: 8px 0;
}

.description {
  color: var(--muted);
}

.gold-btn {
  background: var(--gold);
  color: #090909;
  text-decoration: none;
  padding: 12px 18px;
  border-radius: 9px;
  font-weight: 800;
}

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 25px 0 15px;
}

.filters input,
.filters select {
  background: #141416;
  color: #eee;
  border: 1px solid #343438;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
}

.filters input {
  flex: 1;
  min-width: 210px;
}

.catalog-info {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 20px;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.item {
  background: linear-gradient(145deg, #18181b, #101012);
  border: 1px solid #29292d;
  border-radius: 16px;
  overflow: hidden;
  transition: .25s;
}

.item:hover {
  transform: translateY(-4px);
  border-color: #8e7429;
}

.item-art {
  height: 190px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: radial-gradient(circle, #28251a, #121214 70%);
}

.item-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .3s;
}

.item:hover .item-art img {
  transform: scale(1.05);
}

.item-body {
  padding: 16px;
}

.item small {
  color: var(--gold);
  font-size: 11px;
}

.item h3 {
  margin: 9px 0;
  font-size: 15px;
  line-height: 1.5;
}

.item p {
  min-height: 38px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.item-price {
  font-size: 20px;
  font-weight: 800;
  margin: 14px 0;
}

.gold-action {
  width: 100%;
  padding: 11px;
  border: 0;
  border-radius: 9px;
  background: var(--gold);
  color: #080808;
  font-weight: 800;
  cursor: pointer;
}

.gold-action:hover {
  background: #f0cf5c;
}

.empty {
  padding: 35px;
  text-align: center;
  color: #aaa;
  grid-column: 1 / -1;
}

@media (max-width: 1100px) {
  .catalog-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 750px) {
  .catalog-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .catalog {
    padding: 110px 5% 40px;
  }

  .catalog h1 {
    font-size: 30px;
  }
}

@media (max-width: 450px) {
  .catalog-grid {
    grid-template-columns: 1fr;
  }
}
</style>

const imageByCategory = {

// Convert product data into objects
const products = rawProducts.map((p, i) => ({
  id: i + 1,
  name: p[0],
  category: p[1],
  price: p[2],
  stock: p[3],
  seller: p[4],
  image: image(p[5]),
  desc: p[6]
}));

// Include seller-created products saved in this browser
function allProducts() {
  let custom = [];

  try {
    const saved = JSON.parse(
      localStorage.getItem("zoroListings") || "[]"
    );

    if (Array.isArray(saved)) {
      custom = saved;
    }
  } catch (e) {
    console.log("Could not load seller listings.");
  }

  return [...products, ...custom];
}

// Prevent product text from inserting HTML
function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

// Display products
function render() {
  const keyword = (
    document.getElementById("keyword").value ||
    document.getElementById("searchInput").value
  ).trim().toLowerCase();

  const category = document.getElementById("category").value;
  const sort = document.getElementById("sort").value;

  let list = allProducts().filter(p =>
    (
      String(p.name || "") + " " +
      String(p.category || "") + " " +
      String(p.seller || "")
    ).toLowerCase().includes(keyword) &&
    (category === "ALL" || p.category === category)
  );

  if (sort === "low") {
    list.sort((a, b) => Number(a.price) - Number(b.price));
  }

  if (sort === "high") {
    list.sort((a, b) => Number(b.price) - Number(a.price));
  }

  document.getElementById("productCount").textContent =
    `${list.length} products found`;

  document.getElementById("grid").innerHTML = list.length
    ? list.map(p => `
      <article class="item">

        <div class="item-art">
          <img
            src="${safeText(p.image || image(imageByCategory[p.category] || imageByCategory.Accessories))}"
            alt="${safeText(p.name)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='${image(imageByCategory[p.category] || imageByCategory.Accessories)}'"
          >
        </div>

        <div class="item-body">

          <small>
            ${safeText(p.category)} · ${Number(p.stock) || 0} in stock
          </small>

          <h3>${safeText(p.name)}</h3>

          <p>
            ${safeText(p.desc || "Seller listed product")}
            <br>
            Seller: ${safeText(p.seller || "ZoroMart Seller")}
          </p>

          <div class="item-price">
            ₹${Number(p.price || 0).toLocaleString("en-IN")}
          </div>

          <button class="gold-action" data-id="${safeText(p.id)}">
            Add to Cart +
          </button>

        </div>
      </article>
    `).join("")
    : '<div class="empty">No products match your search.</div>';
}

// Add selected product to cart
function addCart(id) {
  const p = allProducts().find(x => String(x.id) === String(id));

  if (!p) return;

  let cart = [];

  try {
    const saved = JSON.parse(
      localStorage.getItem("zoroCart") || "[]"
    );

    if (Array.isArray(saved)) {
      cart = saved;
    }
  } catch (e) {
    cart = [];
  }

  const existing = cart.find(x => x.name === p.name);

  if (existing) {
    existing.quantity = (Number(existing.quantity) || 1) + 1;
  } else {
    cart.push({
      id: p.id,
      name: p.name,
      price: Number(p.price),
      quantity: 1,
      category: p.category,
      art: "📦",
      image: p.image || ""
    });
  }

  localStorage.setItem("zoroCart", JSON.stringify(cart));

  alert(p.name + " added to cart!");
}

// Add-to-cart button click handler
document.getElementById("grid").addEventListener("click", e => {
  const button = e.target.closest("button[data-id]");

  if (button) {
    addCart(button.dataset.id);
  }
});

// Search, category and price sorting
["keyword", "category", "sort"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});

// Header search
document.getElementById("searchInput").addEventListener("input", () => {
  document.getElementById("keyword").value =
    document.getElementById("searchInput").value;

  render();
});

document.getElementById("searchBtn").addEventListener("click", render);

// Load products when the page opens
render();
