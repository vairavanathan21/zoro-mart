<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZoroMart | Admin Console</title><link rel="stylesheet" href="style.css"><style>.dash{padding:125px 7% 70px}.eyebrow{color:#d4af37;letter-spacing:3px;font-size:11px;font-weight:800}.dash h1{font:700 38px Cinzel,serif;margin:8px 0 25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat,.panel{background:#141416;border:1px solid #2b2b30;border-radius:15px;padding:22px}.stat span{color:#999;font-size:12px}.stat strong{display:block;font-size:30px;margin-top:10px}.panel{margin-top:20px}.panel h2{font-size:18px;margin-bottom:15px}.rowdata{padding:12px 0;border-bottom:1px solid #303035;display:flex;justify-content:space-between;gap:12px}.muted{color:#999}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style></head><body><header class="header"><a class="logo" href="index.html"><span>⚡</span>ZoroMart</a><nav class="nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="seller-dashboard.html">Seller</a><a href="login.html">Logout</a></nav></header><main class="dash"><p class="eyebrow">MARKETPLACE CONTROL</p><h1>Admin Console</h1><div class="stats"><div class="stat"><span>Registered demo users</span><strong id="usersCount">0</strong></div><div class="stat"><span>Seller listings</span><strong id="productsCount">0</strong></div><div class="stat"><span>Saved orders</span><strong id="ordersCount">0</strong></div></div><section class="panel"><h2>Users</h2><div id="users"></div></section><section class="panel"><h2>Marketplace listings · moderation</h2><div id="products"></div></section><section class="panel"><h2>Orders</h2><div id="orders"></div></section></main><script>const users=JSON.parse(localStorage.getItem('zoroUsers')||'[]'),products=JSON.parse(localStorage.getItem('zoroListings')||'[]'),orders=JSON.parse(localStorage.getItem('zoroOrders')||'[]');document.getElementById('usersCount').textContent=users.length;document.getElementById('productsCount').textContent=products.length;document.getElementById('ordersCount').textContent=orders.length;document.getElementById('users').innerHTML=users.length?users.map(u=>`<div class="rowdata"><span>${u.name} <small class="muted">${u.email}</small></span><b>${u.role||'BUYER'}</b></div>`).join(''):'<p class="muted">No demo users registered.</p>';function del(id){localStorage.setItem('zoroListings',JSON.stringify(products.filter(p=>p.id!==id)));location.reload()}document.getElementById('products').innerHTML=products.length?products.map(p=>`<div class="rowdata"><span>${p.name}<small class="muted"> · ${p.category} · ₹${p.price}</small></span><button onclick="del(${p.id})" style="background:#332020;color:#ffb2b2;border:1px solid #633;padding:7px 10px;border-radius:7px">Remove listing</button></div>`).join(''):'<p class="muted">No seller listings to moderate.</p>';document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<div class="rowdata"><span>${o.orderId||'Order'} · ${o.name||'Buyer'}</span><b>₹${o.total||0}</b></div>`).join(''):'<p class="muted">No demo orders found. Orders must be persisted by the Java backend for production.</p>';</script></body></html>
